version: "2"

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused) plus:
  enable:
    - gosec
    - misspell
    - revive
  exclusions:
    rules:
      # The command tests run the go tool and the wvet binary they built, and
      # read their own golden file; the paths are the test's, not input.
      - path: _test\.go
        linters: [gosec]
        text: "G204|G304"

formatters:
  enable:
    - gofmt
    - goimports
